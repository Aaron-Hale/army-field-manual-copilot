name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: |
          PYTHONPATH=. pytest -q

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Start API server (background)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AFMC_KB_ID: ${{ secrets.AFMC_KB_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AFMC_MODEL_ID: "amazon.nova-micro-v1:0"
          AFMC_TOP_K_MAX: "5"
          AFMC_MAX_OUTPUT_TOKENS: "400"
          AFMC_MAX_CONTEXT_TOKENS: "1800"
          AFMC_MIN_RETRIEVAL_SCORE: "0.45"
          AFMC_RATE_LIMIT_RPM: "0"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done

          echo "Server did not start. Logs:"
          tail -200 uvicorn.log
          exit 1

      - name: Gold eval regression gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AFMC_KB_ID: ${{ secrets.AFMC_KB_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EVAL_MAX_QUESTIONS: "50"
        run: |
          python eval/run_eval.py --input eval/gold_subset.jsonl --report docs/report_ci.md --sleep-seconds 0.0
          sed -n '1,200p' docs/report_ci.md

          grep -q "JSON validity rate: \\*\\*100.0%\\*\\*" docs/report_ci.md

          python - <<'PY'
          import re, sys, pathlib
          txt = pathlib.Path("docs/report_ci.md").read_text()
          m = re.search(r"Citation rate \\(non-refusals\\): \\*\\*([0-9.]+)%\\*\\*", txt)
          if not m:
              sys.exit("Could not parse citation rate")
          rate = float(m.group(1))
          if rate < 95.0:
              sys.exit(f"Citation rate too low: {rate}%")
          print("Citation rate OK:", rate)
          PY

          python - <<'PY'
          import re, sys, pathlib
          txt = pathlib.Path("docs/report_ci.md").read_text()
          m = re.search(r"Refusal correctness: \\*\\*([0-9.]+)%\\*\\*", txt)
          if not m:
              sys.exit("Could not parse refusal correctness")
          rate = float(m.group(1))
          if rate < 90.0:
              sys.exit(f"Refusal correctness too low: {rate}%")
          print("Refusal correctness OK:", rate)
          PY

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            docs/report_ci.md
            uvicorn.log
